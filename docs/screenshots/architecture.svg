<text x="720.0" y="782" font-family="Consolas, 'DejaVu Sans Mono', Menlo, 'Courier New', monospace" font-size="15" text-anchor="middle" fill="#808690">Everything stays on your machine — no account, no cloud, no telemetry. Voyager only ever reads agent storage.</text>
