<text x="470.0" y="76" font-family="Consolas, 'DejaVu Sans Mono', Menlo, 'Courier New', monospace" font-size="32" text-anchor="start" fill="#f2f2f2">Voyager</text>
<text x="614.0" y="86" font-family="Consolas, 'DejaVu Sans Mono', Menlo, 'Courier New', monospace" font-size="19" text-anchor="start" fill="#5fd0d6">one index across every AI coding agent</text>
<text x="720.0" y="109" font-family="Consolas, 'DejaVu Sans Mono', Menlo, 'Courier New', monospace" font-size="17" text-anchor="middle" fill="#808690">8 platforms · 8 storage formats  →  one normalized local index  →  one query surface</text>
<text x="240.0" y="155" font-family="Consolas, 'DejaVu Sans Mono', Menlo, 'Courier New', monospace" font-size="17" text-anchor="middle" fill="#808690">YOUR AGENTS  (read-only adapters)</text>
