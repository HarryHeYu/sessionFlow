name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # every supported Python on Linux; the two ends on Windows, because the
        # adapters read Windows paths (%APPDATA%, drive letters, backslashes)
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          # The release-metadata check compares README against the tags that
          # exist. `fetch-tags: true` alone left the tag list empty in CI
          # (measured on run 42594999041), so fetch the full history: it is the
          # only form that reliably carries tags.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (all extras + test deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
          python -m pip list

      - name: Run test suite
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short -rf > pytest.log 2>&1
          rc=$?
          tail -80 pytest.log
          if [ $rc -ne 0 ]; then
            # make the failures readable from the UI *and* from the checks API
            # (job logs need a token; annotations do not)
            python scripts/ci_report_failures.py pytest.log
          fi
          exit $rc

      - name: Release metadata consistency
        # Two-phase release (docs/MAINTENANCE.md): a candidate commit may bump
        # pyproject/CHANGELOG/release notes to the next version while README
        # pins stay on the newest tag that ACTUALLY exists. check_consistency.py
        # is the single invariant for BOTH phases: README pins and the current
        # release row must name a real, newest released tag. That directly
        # forbids a phantom pin (installing vX.Y.Z before vX.Y.Z is tagged).
        #
        # At tag time the pin patch and the tag are pushed together, so the
        # tag exists when this check runs on the tag tree and the SAME strict
        # command passes. check_release_ready.py is the maintainer's LOCAL
        # pre-tag gate (MAINTENANCE.md step 4); it is intentionally not a CI
        # step, because simulating a not-yet-existing tag is exactly what let
        # a candidate advertise an install target users cannot install.
        shell: bash
        run: |
          python scripts/check_consistency.py

  core-only:
    # The core install must work with zero optional dependencies: `pip install
    # voyager` gives a working CLI, and only the MCP server needs the [mcp] extra.
    name: core install (no extras) on py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: CLI works without extras
        run: |
          voyager --help
          voyager stats --db "$RUNNER_TEMP/ci.db"
          voyager list --db "$RUNNER_TEMP/ci.db"

      - name: MCP server explains the missing extra instead of crashing
        run: |
          python - <<'PY'
          import subprocess, sys
          p = subprocess.run([sys.executable, "-m", "voyager.mcp_server"],
                             capture_output=True, text=True, timeout=60)
          msg = p.stdout + p.stderr
          assert "pip install" in msg and "mcp" in msg, msg
          assert "Traceback" not in msg, msg          # a hint, not a crash
          print("ok:", msg.strip().splitlines()[0])
          PY

      - name: Test suite (extras-dependent tests skip themselves)
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short -rf > pytest.log 2>&1
          rc=$?
          tail -40 pytest.log
          if [ $rc -ne 0 ]; then
            python scripts/ci_report_failures.py pytest.log
          fi
          exit $rc

  macos-smoke:
    # A platform-independent wheel is not proof of macOS execution. This job
    # verifies package install, CLI smoke and demo isolation on macOS without
    # GUI, provider credentials or Native Resume.
    name: macOS package smoke on py3.13
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: CLI smoke
        run: |
          voyager --version
          voyager --help
          voyager stats --db "$RUNNER_TEMP/r19-smoke.db"
          voyager list --db "$RUNNER_TEMP/r19-smoke.db"

      - name: Demo isolation + handoff regressions
        run: |
          python -m pytest tests/test_demo_db_override.py tests/test_handoff_lease_cleanup.py -q
          voyager demo --db "$RUNNER_TEMP/r19-demo.db"
          test -f "$RUNNER_TEMP/r19-demo.db"
